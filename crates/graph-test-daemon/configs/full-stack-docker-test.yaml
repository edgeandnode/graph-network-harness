# Full Graph Protocol Stack Configuration - Docker Integration Test
name: graph-full-stack-docker
description: Complete Graph Protocol test environment in Docker container via SSH

services:
  # PostgreSQL - Database for Graph Node
  postgres:
    service_type: postgres
    target:
      type: layered
      params:
        binary: /usr/lib/postgresql/14/bin/postgres
        data_dir: /var/lib/postgresql/data
        host: 0.0.0.0
        port: 5432
      layers:
        - type: ssh
          host: localhost
          user: testuser
          port: 2222
          identity_file: tests/docker-test-env/ssh-keys/test_ed25519
          env:
            POSTGRES_USER: postgres
            POSTGRES_DB: graph-node
      command_template: "{binary} -D {data_dir} -h {host} -p {port}"
      health_check:
        command: pg_isready
        args:
          - "-h"
          - "localhost"
          - "-p"
          - "5432"
        interval: 2
        timeout: 1
        retries: 10
    depends_on: []

  # IPFS - Content storage
  ipfs:
    service_type: ipfs
    target:
      type: layered
      params:
        binary: ipfs
      layers:
        - type: ssh
          host: localhost
          user: testuser
          port: 2222
          identity_file: tests/docker-test-env/ssh-keys/test_ed25519
          env:
            IPFS_PATH: /home/testuser/.ipfs
      command_template: "{binary} daemon"
      health_check:
        command: ipfs
        args:
          - "id"
        interval: 2
        timeout: 1
        retries: 10
    depends_on: []

  # Anvil - Local Ethereum node
  anvil:
    service_type: anvil
    target:
      type: layered
      params:
        binary: /root/.foundry/bin/anvil
        host: "0.0.0.0"
        port: 8545
        chain_id: 31337
        block_time: 1
      layers:
        - type: ssh
          host: localhost
          user: testuser
          port: 2222
          identity_file: tests/docker-test-env/ssh-keys/test_ed25519
          env:
            RUST_LOG: info
      command_template: "{binary} --host {host} --port {port} --chain-id {chain_id} --block-time {block_time}"
      health_check:
        command: curl
        args:
          - "-s"
          - "-X"
          - "POST"
          - "-H"
          - "Content-Type: application/json"
          - "--data"
          - '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
          - "http://localhost:8545"
        interval: 2
        timeout: 1
        retries: 10
    depends_on: []

