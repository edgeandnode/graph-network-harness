# Graph Protocol Test Stack Configuration - SSH Container Version
name: graph-test-stack-ssh
description: Complete Graph Protocol test environment in SSH container

services:
  # PostgreSQL database for Graph Node
  postgres:
    service_type: postgres
    name: postgres
    target:
      type: layered
      layers:
        - type: ssh
          host: graph-container
          user: root
          port: 2222
          identity_file: ~/.ssh/graph_test_key
        - type: local
          working_dir: /opt/graph
      command: 
        binary: systemctl
        args: ["start", "postgresql"]
      env:
        POSTGRES_USER: graph-node
        POSTGRES_PASSWORD: graph-password
        POSTGRES_DB: graph-node
    health_check:
      command: pg_isready
      args: ["-U", "graph-node"]
      interval: 5
      timeout: 3
      retries: 5

  # IPFS for subgraph storage
  ipfs:
    service_type: ipfs
    name: ipfs
    target:
      type: layered
      layers:
        - type: ssh
          host: graph-container
          user: root
          port: 2222
          identity_file: ~/.ssh/graph_test_key
        - type: local
          working_dir: /opt/graph
      command:
        binary: systemctl
        args: ["start", "ipfs"]
      env: {}
    health_check:
      command: curl
      args: ["http://localhost:5001/api/v0/id"]
      interval: 5
      timeout: 3
      retries: 5

  # Anvil local blockchain
  anvil:
    service_type: anvil
    name: anvil
    target:
      type: layered
      layers:
        - type: ssh
          host: graph-container
          user: root
          port: 2222
          identity_file: ~/.ssh/graph_test_key
        - type: local
          working_dir: /opt/graph
      command:
        binary: anvil
        args:
          - --host
          - "0.0.0.0"
          - --port
          - "8545"
          - --chain-id
          - "31337"
      env:
        RUST_LOG: info
    health_check:
      command: curl
      args:
        - "-X"
        - "POST"
        - "-H"
        - "Content-Type: application/json"
        - "--data"
        - '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
        - "http://localhost:8545"
      interval: 2
      timeout: 1
      retries: 10

  # Graph Node indexer
  graph-node:
    service_type: graph-node
    name: graph-node
    target:
      type: layered
      layers:
        - type: ssh
          host: graph-container
          user: root
          port: 2222
          identity_file: ~/.ssh/graph_test_key
        - type: local
          working_dir: /opt/graph
      command:
        binary: systemctl
        args: ["start", "graph-node"]
      env:
        postgres_host: localhost
        postgres_user: graph-node
        postgres_pass: graph-password
        postgres_db: graph-node
        ipfs: localhost:5001
        ethereum: mainnet:http://localhost:8545
        GRAPH_LOG: info
    dependencies:
      - service: postgres
      - service: ipfs
      - service: anvil
    health_check:
      command: curl
      args:
        - "-X"
        - "POST"
        - "-H"
        - "Content-Type: application/json"
        - "--data"
        - '{"query":"{ indexingStatuses { subgraph health } }"}'
        - "http://localhost:8030/graphql"
      interval: 10
      timeout: 5
      retries: 10